<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leonida Atlas</title>
<meta name="theme-color" content="#16122F">
<meta name="description" content="Unofficial GTA 6 companion app, refreshed automatically.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Noto+Sans+Arabic:wght@400..800&family=Noto+Sans+JP:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#16122F; --panel:#211B45; --raise:#2A2356; --line:#3A3270;
  --text:#F3EFFB; --muted:#ABA4CC; --sun:#FF6B8B; --gold:#FFC46B; --sea:#3DD4C3;
  --ok:#3DD4C3; --bad:#FF6B8B;
  --font:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --navh:0px;
  color-scheme: dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root{ --night:#ECF3F4; --panel:#FFFFFF; --raise:#F4F8F9; --line:#CEDCE0;
    --text:#1B1838; --muted:#5B5F7B; --sun:#D23F63; --gold:#A86A12; --sea:#0D8478;
    --ok:#0D8478; --bad:#C2304F; color-scheme: light; }
}
:root:lang(ja){--font:"Archivo","Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
:root:lang(ar){--font:"Noto Sans Arabic","Archivo",system-ui,sans-serif}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
:lang(ar) body{line-height:1.75}
a{color:var(--sea)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:96px minmax(0,1fr);min-height:100vh}

/* Navigationsleiste */
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:16px 8px;border-inline-end:1px solid var(--line);background:var(--panel)}
.rail .brand{display:flex;justify-content:center;margin:2px 0 18px}
.rail .brand img{width:52px;height:52px;border-radius:14px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;color:var(--muted);text-decoration:none;font-size:12.5px;font-weight:600;position:relative;text-align:center;line-height:1.2}
.nav a svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav a[aria-current="page"]{background:var(--raise);color:var(--text)}
.nav a[aria-current="page"] svg{stroke:var(--sun)}
.nav a .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{position:absolute;top:4px;inset-inline-end:14px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--sun);color:#fff;font-size:11.5px;line-height:20px;text-align:center;font-weight:700}

/* Kopfzeile */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:12px 14px;padding:14px 28px;background:color-mix(in srgb,var(--night) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--night)}
.top h1{margin:0;font-size:22px;font-stretch:115%;font-weight:750;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:14px;color:var(--muted);text-align:end;line-height:1.3}
.status b{color:var(--text);font-weight:600}
.status .err{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-weight:650;cursor:pointer;min-height:44px;min-width:44px;text-decoration:none;color:var(--text);white-space:nowrap}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.primary{background:var(--sun);border-color:var(--sun);color:#fff}
.btn[disabled]{opacity:.75;cursor:progress}
.btn.busy svg{animation:spin 1s linear infinite}
.btn.lang{padding:10px 14px;font-variant-numeric:tabular-nums}
.btn.lang .code{font-size:14px;letter-spacing:.02em}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.btn.busy svg{animation:none}}

.view{padding:28px;max-width:1500px;width:100%}

/* Horizont */
.horizon{position:relative;border-radius:28px;overflow:hidden;min-height:260px;display:flex;align-items:flex-end;
  background:linear-gradient(180deg,#2B1D63 0%,#7A2E7E 38%,#FF6B8B 62%,#FFC46B 74%,#1F6F7A 74.4%,#123E58 100%)}
.horizon .sun{position:absolute;inset-inline-end:9%;top:16%;width:230px;aspect-ratio:1;border-radius:50%;
  background:linear-gradient(180deg,#FFE29A 0%,#FFB36B 45%,#FF6B8B 100%);
  -webkit-mask:linear-gradient(180deg,#000 0 52%,transparent 52% 56%,#000 56% 64%,transparent 64% 69%,#000 69% 76%,transparent 76% 83%,#000 83% 88%,transparent 88%);
          mask:linear-gradient(180deg,#000 0 52%,transparent 52% 56%,#000 56% 64%,transparent 64% 69%,#000 69% 76%,transparent 76% 83%,#000 83% 88%,transparent 88%)}
.horizon .water{position:absolute;inset:74.4% 0 0;background:repeating-linear-gradient(180deg,transparent 0 9px,rgba(255,255,255,.07) 9px 10px)}
.horizon .copy{position:relative;padding:28px 32px;color:#fff;max-width:min(760px,62%)}
.horizon .count{font-size:clamp(34px,5.6vw,78px);font-stretch:125%;font-weight:850;line-height:.98;letter-spacing:-.02em;margin:0 0 12px;text-shadow:0 2px 24px rgba(22,18,47,.35)}
.horizon .count span{display:block}
:lang(ar) .horizon .count,:lang(ja) .horizon .count{letter-spacing:0;line-height:1.2}
.horizon p{margin:0;font-size:18px;max-width:52ch;color:rgba(255,255,255,.94)}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;margin-top:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 22px;min-width:0}
.card h2{margin:0 0 12px;font-size:19px;font-stretch:112%;font-weight:750}
.span-7{grid-column:span 7}.span-5{grid-column:span 5}
@media (max-width:1100px){.span-7,.span-5{grid-column:span 12}}

.rows{list-style:none;margin:0;padding:0}
.rows li{border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.row{display:flex;gap:12px;align-items:baseline;padding:11px 2px;color:var(--text);text-decoration:none}
a.row:hover .t{text-decoration:underline}
.row .t{flex:1;min-width:0;font-weight:560}
.row .m{color:var(--muted);font-size:14px;white-space:nowrap}
.row .sub{display:block;color:var(--muted);font-size:14.5px;font-weight:400;margin-top:2px}
.tag{display:inline-block;font-size:12.5px;font-weight:650;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.new{color:var(--sea);border-color:color-mix(in srgb,var(--sea) 50%,transparent)}
.tag.changed{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.muted{color:var(--muted)}
.empty{padding:10px 2px;color:var(--muted);margin:0}

.src-list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.src-list li{display:flex;gap:10px;align-items:baseline}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;transform:translateY(-1px)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}

/* Wissen */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.cats{position:sticky;top:96px;max-height:calc(100vh - 120px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:10px}
.cats h3{margin:14px 10px 6px;font-size:13.5px;color:var(--muted);font-weight:650}
.cats a{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:12px;color:var(--text);text-decoration:none;font-weight:540}
.cats a span{color:var(--muted);font-weight:500;font-size:14px}
.cats a[aria-current="true"]{background:var(--raise);box-shadow:inset 3px 0 0 var(--sun)}
[dir="rtl"] .cats a[aria-current="true"]{box-shadow:inset -3px 0 0 var(--sun)}
.list-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 14px}
.list-head h2{margin:0;font-size:30px;font-stretch:118%;font-weight:780;letter-spacing:-.01em}
:lang(ar) .list-head h2,:lang(ja) .list-head h2{letter-spacing:0}
.filter{flex:1;min-width:200px;max-width:340px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.pagelist{columns:2 320px;column-gap:28px}
.pagelist a{display:block;break-inside:avoid;padding:10px 0;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none}
.pagelist a:hover .t{text-decoration:underline}
.pagelist .t{font-weight:580}
.pagelist .sub{display:block;font-size:14.5px;color:var(--muted)}
.saved{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sea);margin-inline-start:6px;vertical-align:middle}

/* Leseansicht */
.reader{max-width:880px}
.reader .back{margin-bottom:18px}
.reader h2.title{font-size:clamp(28px,4vw,46px);font-stretch:120%;font-weight:820;line-height:1.08;letter-spacing:-.015em;margin:0 0 12px}
:lang(ar) .reader h2.title,:lang(ja) .reader h2.title{letter-spacing:0;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;color:var(--muted);font-size:14.5px;margin-bottom:22px}
.prose{font-size:18px;line-height:1.65}
.prose:lang(ar){line-height:1.85}
.prose p,.prose ul,.prose ol{max-width:70ch}
.prose h2,.prose h3,.prose h4{font-stretch:110%;line-height:1.25;margin:1.6em 0 .5em}
.prose h2{font-size:25px}.prose h3{font-size:21px}.prose h4{font-size:18px}
.prose img{max-width:100%;height:auto;border-radius:10px}
.prose figure{margin:1em 0}
.prose figcaption,.prose .thumbcaption{font-size:14px;color:var(--muted)}
.prose .table-wrap{overflow-x:auto;margin:1em 0;max-width:100%}
.prose table{border-collapse:collapse;font-size:15.5px;overflow-wrap:normal;word-break:normal}
.prose th,.prose td{min-width:7ch}
.prose th,.prose td{border:1px solid var(--line);padding:7px 10px;text-align:start;vertical-align:top}
.prose th{background:var(--raise)}
.prose .portable-infobox,.prose .infobox{float:inline-end;width:300px;margin-block:0 16px;margin-inline:22px 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;font-size:15px}
.prose .portable-infobox h2,.prose .portable-infobox h3{font-size:16px;margin:.6em 0 .3em}
.prose .portable-infobox .pi-data{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.prose .portable-infobox .pi-data-label{flex:0 0 40%;font-weight:650;margin:0}
.prose .timeline{list-style:none;padding:0;border-inline-start:3px solid var(--sun);margin-inline-start:6px}
.prose .timeline li{padding-block:6px 10px;padding-inline-start:18px;position:relative}
.prose .timeline li::before{content:"";position:absolute;inset-inline-start:-8px;top:15px;width:13px;height:13px;border-radius:50%;background:var(--night);border:3px solid var(--sun)}
.prose blockquote{border-inline-start:3px solid var(--line);margin:1em 0;padding:.2em 1em;color:var(--muted)}
.notice{background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 18px;font-size:15.5px}

/* Suche */
.search{display:flex;gap:12px;margin-bottom:20px}
.search input{flex:1;min-width:0;font-size:20px;padding:14px 18px;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
mark{background:color-mix(in srgb,var(--gold) 35%,transparent);color:inherit;border-radius:3px}

/* Optionen */
.set{display:grid;gap:18px;max-width:820px}
.opt{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.card h2 + .opt{border-top:0}
.opt input[type=checkbox]{width:24px;height:24px;accent-color:var(--sun);margin-top:2px;flex:none}
.opt label{flex:1;min-width:200px}
.opt .sub{display:block;color:var(--muted);font-size:14.5px}
select,textarea{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-width:100%}
textarea{width:100%;min-height:84px;direction:ltr;text-align:start}
.btnrow{display:flex;flex-wrap:wrap;gap:12px}

/* Sprachauswahl */
dialog.langs{border:1px solid var(--line);border-radius:22px;background:var(--panel);color:var(--text);padding:18px;width:min(420px,calc(100vw - 32px))}
dialog.langs::backdrop{background:rgba(10,8,25,.55)}
dialog.langs h2{margin:4px 6px 12px;font-size:20px;font-stretch:112%}
.langlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.langlist button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--raise);cursor:pointer;text-align:start;min-height:60px}
.langlist button .n{font-weight:700;font-size:17px}
.langlist button .c{font-size:13px;color:var(--muted)}
.langlist button[aria-current="true"]{border-color:var(--sun);box-shadow:inset 0 0 0 1px var(--sun)}
dialog.langs .close{margin-top:14px;width:100%}

.toast{position:fixed;left:50%;bottom:calc(24px + var(--navh) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--text);color:var(--night);padding:12px 18px;border-radius:14px;font-weight:600;width:max-content;max-width:min(92vw,640px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast button{margin-inline-start:12px;background:none;border:0;color:var(--sun);font-weight:750;cursor:pointer;padding:6px}

/* Tablet hochkant und kleiner */
@media (max-width:1000px){
  .status .long{display:none}
  .horizon{min-height:300px}
  .horizon .sun{width:140px;inset-inline-end:6%;top:9%}
  .horizon .copy{max-width:none}
}
/* Smartphone */
@media (max-width:760px){
  :root{--navh:64px}
  body{font-size:16px}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));border-inline-end:0;border-top:1px solid var(--line);z-index:20}
  .rail .brand{display:none}
  .nav{display:flex;width:100%}
  .nav a{flex:1 1 0;min-width:0;padding:6px 2px;font-size:11px;gap:2px;border-radius:12px}
  .nav a svg{width:23px;height:23px}
  .badge{top:2px;inset-inline-end:calc(50% - 22px)}
  .main{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px))}
  .top{flex-wrap:wrap;padding:10px 14px;gap:8px 10px}
  .top h1{font-size:19px;font-stretch:108%}
  .status{order:5;flex-basis:100%;text-align:start;font-size:13px}
  .status br{display:none}
  .btn.refresh .lbl{display:none}
  .btn.refresh{padding:10px 12px}
  .view{padding:16px 14px}
  .horizon{min-height:250px;border-radius:22px}
  .horizon .sun{width:104px;top:10%}
  .horizon .copy{padding:20px}
  .horizon .count{font-size:clamp(30px,9vw,44px)}
  .horizon p{font-size:15.5px}
  .grid{gap:14px;margin-top:14px}
  .card{padding:16px;border-radius:18px}
  .split{grid-template-columns:minmax(0,1fr);gap:14px}
  .cats{position:static;max-height:none;display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;background:none;border:0;border-radius:0;scroll-snap-type:x proximity;scrollbar-width:none;margin-inline:-14px;padding-inline:14px}
  .cats::-webkit-scrollbar{display:none}
  .cats h3,.cats .empty{display:none}
  .cats a{flex:none;scroll-snap-align:start;white-space:nowrap;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:15px}
  .cats a[aria-current="true"],[dir="rtl"] .cats a[aria-current="true"]{background:var(--sun);border-color:var(--sun);color:#fff;box-shadow:none}
  .cats a[aria-current="true"] span{color:#fff}
  .list-head h2{font-size:24px}
  .filter{max-width:none;min-width:0;width:100%}
  .reader h2.title{font-size:clamp(26px,7.5vw,34px)}
  .prose{font-size:17px}
  .prose .portable-infobox,.prose .infobox{float:none;width:auto;margin:0 0 16px}
  .search input{font-size:17px;padding:12px 14px}
  .langlist{grid-template-columns:1fr}
  dialog.langs{margin:auto auto 0;width:100%;max-width:100%;border-radius:22px 22px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:370px){
  .nav a .lbl{font-size:10px}
  .top h1{font-size:17px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail">
    <div class="brand"><img src="icons/icon-192.png" alt="Leonida Atlas"></div>
    <div class="nav" id="nav"></div>
  </nav>
  <div class="main">
    <header class="top">
      <h1 id="title">Leonida Atlas</h1>
      <div class="status" id="status" aria-live="polite"></div>
      <button class="btn lang" id="langBtn" type="button" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg>
        <span class="code" id="langCode">EN</span>
      </button>
      <button class="btn primary refresh" id="refreshBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <span class="lbl">Refresh</span>
      </button>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<dialog class="langs" id="langDlg" aria-labelledby="langTitle">
  <h2 id="langTitle"></h2>
  <div class="langlist" id="langList"></div>
  <button class="btn close" id="langClose" type="button"></button>
</dialog>
<div id="toastHost"></div>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
